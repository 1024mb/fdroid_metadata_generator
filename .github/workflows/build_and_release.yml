name: Build and release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.rls_metadata.outputs.version }}
      zip_name: ${{ steps.rls_metadata.outputs.zip_name }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Prepare Release Metadata
        id: rls_metadata
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${{ github.event.repository.name }}_win64_v${GITHUB_REF_NAME#v}.zip" >> "$GITHUB_OUTPUT"
          echo "executable_name=${{ github.event.repository.name }}.exe" >> "$GITHUB_OUTPUT"

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: ${{ vars.MAIN_PY_FILE }}
          mode: onefile
          deployment: true
          company-name: ${{ github.repository_owner }}
          product-name: ${{ github.event.repository.name }}
          file-version: ${{ steps.rls_metadata.outputs.version }}
          product-version: ${{ steps.rls_metadata.outputs.version }}
          output-file: ${{ steps.rls_metadata.outputs.executable_name }}
          onefile-tempdir-spec: '{CACHE_DIR}/{COMPANY}/{PRODUCT}/{VERSION}'

      - name: Setup 7-zip
        uses: milliewalky/setup-7-zip@v2
        with:
          tag: latest

      - name: Compress Executable
        run: |
          7z a -tzip \
            ".\archives\${{ steps.rls_metadata.outputs.zip_name }}" \
            ".\build\${{ steps.rls_metadata.outputs.executable_name }}" \
            ".\sdk_names.json" \
            ".\replacement_file_example.json" \
            ".\data.json" \
            ".\LICENSE"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: |
            archives/${{ steps.rls_metadata.outputs.zip_name }}
          archive: false

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip_name }}
          path: archives/
          skip-decompress: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            archives/*
          generate_release_notes: true
